# 规则集定义
rule-anchor:
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  custom_yaml: &custom_yaml {type: http, interval: 86400, behavior: classical, format: yaml}

# 规则集全部改用单行继承写法
rule-providers:
  # Fake-IP 专用排除列表（文本格式）
  fakeipfilter_cn: {<<: *domain_text, url: "https://raw.githubusercontent.com/AdoreYL/rule/refs/heads/main/geo/fakeipfilter_cn.yaml"}
