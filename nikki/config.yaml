# 防 DNS 泄露 + 全链路 DoH 防劫持 + 支持 IPv6 节点完整配置 (兼容 Nikki 面板)
# 机场订阅
proxy-providers:
  Airport_A:
    url: "订阅"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.google.com/generate_204
      interval: 300
    proxy: 直连
  AirportASing:
    url: "订阅"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.google.com/generate_204
      interval: 300
    proxy: 直连
  Airport_Ahysteria:
    url: "订阅"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.google.com/generate_204
      interval: 300
    proxy: 直连
    override:
      udp: true
      skip-cert-verify: false
      alpn:
        - h2
      down: "1000Mbps"
      up: "50Mbps"
      port: 18900
      ports: "28000-29000"
  Airport_CF:
    url: "订阅"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.google.com/generate_204
      interval: 900
    proxy: 直连
  Airport落地:
    url: "订阅"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.google.com/generate_204
      interval: 300
    proxy: 直连

# 节点信息
proxies:
  - {name: 直连, type: direct}

# 全局网络与系统配置
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: true # 允许内核建立 IPv6 套接字，支持纯 IPv6 落地节点与双栈中转
unified-delay: true
tcp-concurrent: true
log-level: warning
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 裸核面板配置（如通过 OpenWrt / Nikki 插件管理则保持注释）
external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 协议与流量嗅探
sniffer:
  enable: true
  sniff-dns-mapping: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# TUN 入站配置 (与 Nikki 路由管理模式对齐)
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  #device: nikki
  #使用仅内核自行修改下面三项为true
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS 模块 (防泄露 + 双检分流 + 纯 IP DoH 防劫持 + 双栈监听)
dns:
  enable: true
  prefer-h3: true
  cache-algorithm: arc
  listen: ":::1053"
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  fake-ip-ttl: 1
  fake-ip-filter:
    - "rule-set:fakeipfilter_cn"
    - "rule-set:fakeipfilter_!cn"
    - "rule-set:cn_domain"
    - "rule-set:apple_cn"
    - "rule-set:microsoft_domain"
    - "rule-set:private_domain"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query#disable-qtype-65=true"
    - "https://1.12.12.12/dns-query#disable-qtype-65=true"
  direct-nameserver:
    - "https://223.5.5.5/dns-query#disable-qtype-65=true"
    - "https://1.12.12.12/dns-query#disable-qtype-65=true"
  nameserver-policy:
    # 1. 国内与私有域名：强制走国内高速 DoH，并禁用 Type 65 阻止 IPv6 提示泄漏
    "rule-set:cn_domain,apple_cn,microsoft_domain,private_domain,fakeipfilter_cn":
      - "https://223.5.5.5/dns-query#disable-qtype-65=true"
      - "https://1.12.12.12/dns-query#disable-qtype-65=true"
    # 2. 海外排除 Fake-IP 的域名：走默认代理，并禁用 Type 65
    "rule-set:fakeipfilter_!cn":
      - "https://1.1.1.1/dns-query#🚀 默认代理&disable-qtype-65=true"
      - "https://8.8.8.8/dns-query#🚀 默认代理&disable-qtype-65=true"
  nameserver:
    - "https://1.1.1.1/dns-query#🚀 默认代理&disable-qtype-65=true"
    - "https://8.8.8.8/dns-query#🚀 默认代理&disable-qtype-65=true"


# 出站策略锚点
pr: &pr {type: select, proxies: [🚀 默认代理, 🔯 美国故转, 🔯 日本故转, 🔯 香港故转, ♻️ 日本自动, ♻️ 香港自动, ♻️ 美国自动, ♻️ CF自动, ♻️ 自动选择, 🛩 中转, 🏡 落地, ✨ 落地, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, 🇭🇰 港台节点, 🇰🇷 韩国节点, 🐱 Sub节点, 💨 CF代理, 🌐 全部节点, 🎯 直连]}

proxy-groups:
  - {name: 🚀 默认代理, type: select, proxies: [🔯 美国故转, 🔯 日本故转, 🔯 香港故转, ♻️ 日本自动, ♻️ 香港自动, ♻️ 美国自动, ♻️ CF自动, ♻️ 自动选择, 🛩 中转, 🏡 落地, ✨ 落地, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, 🇭🇰 港台节点, 🇰🇷 韩国节点, 🐱 Sub节点, 💨 CF代理, 🌐 全部节点, 🎯 直连]}
  - {name: 🌐 全部节点, type: select, include-all: true}
  - {name: 🍀 Google, type: select, <<: *pr}
  - {name: 🤖 AI, type: select, <<: *pr}
  - {name: 🎥 YouTube, type: select, <<: *pr}
  - {name: 🎬 OTT, type: select, <<: *pr}
  - {name: 💳 Fin, type: select, <<: *pr}
  - {name: 🪙 BTC, type: select, <<: *pr}
  - {name: 🏎️ Speedtest, type: select, <<: *pr}
  - {name: 💶 PayPal, type: select, <<: *pr}
  - {name: 👨🏿‍💻 GitHub, type: select, <<: *pr}
  - {name: 📲 Telegram, type: select, <<: *pr}
  - {name: 🎮 Game_cn, type: select, <<: *pr}
  - {name: 🕹️ Game, type: select, <<: *pr}
  - {name: 💻 游戏平台, type: select, <<: *pr}
  - {name: 📟 PT, type: select, <<: *pr}
  - {name: ☁️ MNC S, type: select, <<: *pr}
  - {name: 🐬 OneDrive, type: select, <<: *pr}
  - {name: 💨 CF代理, type: select, include-all: true, filter: "(?=.*(?i)(CF|ED))^(?!.*(JC|落地|中转|SS)).*$"}
  - {name: 🏡 落地, type: select, include-all: true, filter: "(?=.*(?i)(SS|落地))^(?!.*(CF|ED|JC|中转)).*$"}
  - {name: ✨ 落地, type: select, include-all: true, filter: "(?=.*(?i)(SS|落地))^(?!.*(CF|ED|JC|中转)).*$"}
  - {name: 🛩 中转, type: select, include-all: true, filter: "(?=.*(?i)(中转))^(?!.*(JC|落地)).*$"}
  - {name: 🇭🇰 港台节点, type: select, include-all: true, filter: "(?=.*(?i)(港|hk|xg|HK|香港|台|TW|tw|台湾|台北))^(?!.*(直连|中转|JC|落地|CF|ED)).*$"}
  - {name: 🇺🇲 美国节点, type: select, include-all: true, filter: "(?=.*(?i)(美|us|US|圣何塞|洛杉矶|凤凰城))^(?!.*(直连|中转|JC|落地|CF|ED)).*$"}
  - {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?=.*(?i)(日|jp|JP|大阪|东京))^(?!.*(直连|中转|JC|落地|CF|ED)).*$"}
  - {name: 🇸🇬 狮城节点, type: select, include-all: true, filter: "(?=.*(?i)(新|sg|SG|新加坡|狮城))^(?!.*(直连|中转|JC|落地|CF|ED)).*$"}
  - {name: 🇰🇷 韩国节点, type: select, include-all: true, filter: "(?=.*(?i)(韩|kr|KR|首尔|春川))^(?!.*(直连|中转|JC|落地|CF|ED)).*$"}
  - {name: 🐱 Sub节点, type: select, include-all: true, filter: "(?=.*(?i)(RY|HX|HY|TUIC|ANT|ANR|VL|VM|TUN|SHT|NA))^(?!.*(直连|中转|JC|落地|CF|ED|SS)).*$"}
  - {name: ♻️ CF自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(?i)(CF|ED))^(?!.*(直连|中转|JC|落地|SS)).*$"}
  - {name: ♻️ 香港自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(港|HK|香港|(?i)Hong))^((?!(直连|中转|JC|落地|CF|ED|SS)).)*$"}
  - {name: ♻️ 日本自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(日|JP|大阪|东京|(?i)Japan))^((?!(直连|中转|JC|落地|CF|ED|SS)).)*$"}
  - {name: ♻️ 美国自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美|US|圣何塞|洛杉矶|(?i)America))^((?!(直连|中转|JC|落地|CF|ED|SS)).)*$"}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|JC|落地|CF|ED|SS)).)*$"}
  - {name: 🔯 香港故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(港|HK|香港|(?i)Hong))^((?!(直连|中转|JC|落地|CF|ED|SS)).)*$"}
  - {name: 🔯 日本故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(日|JP|大阪|东京|(?i)Japan))^((?!(直连|中转|JC|落地|CF|ED|SS)).)*$"}
  - {name: 🔯 美国故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美|US|圣何塞|洛杉矶|(?i)America))^((?!(直连|中转|JC|落地|CF|ED|SS)).)*$"}
  - {name: 🎯 直连, type: select, proxies: [直连]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 默认代理, 🎯 直连]}

